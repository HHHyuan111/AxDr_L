<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1350" viewBox="0 0 1100 1350" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="1100" height="1350" fill="#FFFFFF"/>

  <text x="60" y="56" font-size="30" font-weight="bold" fill="#111827">AxDr FOC 驱动框架 · 目标架构（三层视图）</text>
  <text x="60" y="86" font-size="14" fill="#6B7280">底层硬件层 → 硬件适配接口层 → 上层算法层 · 依赖只许向下 · 纯 C · 无 RTOS</text>

  <!-- ═══ 大层色条（左缘） ═══ -->
  <rect x="10" y="105" width="26" height="440" rx="6" fill="#FDF3E3" stroke="#E8890C" stroke-width="1"/>
  <text x="27" y="325" font-size="15" font-weight="bold" fill="#B45309" text-anchor="middle" transform="rotate(-90 27 325)">上层算法层</text>
  <rect x="10" y="555" width="26" height="465" rx="6" fill="#EAF2FC" stroke="#2F6FBF" stroke-width="1"/>
  <text x="27" y="787" font-size="15" font-weight="bold" fill="#1E40AF" text-anchor="middle" transform="rotate(-90 27 787)">硬件适配接口层</text>
  <rect x="10" y="1030" width="26" height="280" rx="6" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1"/>
  <text x="27" y="1170" font-size="15" font-weight="bold" fill="#14532D" text-anchor="middle" transform="rotate(-90 27 1170)">底层硬件层</text>

  <!-- ══════════ 通信服务层 ══════════ -->
  <text x="52" y="140" font-size="17" font-weight="bold" fill="#374151">通信服务层</text>
  <rect x="170" y="112" width="150" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="245" y="139" font-size="15" text-anchor="middle" fill="#1F2937">ASCII 协议</text>
  <rect x="335" y="112" width="150" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="410" y="139" font-size="15" text-anchor="middle" fill="#1F2937">VOFA 遥测</text>
  <rect x="500" y="112" width="190" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="595" y="139" font-size="15" text-anchor="middle" fill="#1F2937">配置存储 flash+CRC</text>
  <rect x="705" y="112" width="150" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="780" y="139" font-size="15" text-anchor="middle" fill="#1F2937">辨识 / 诊断</text>
  <rect x="870" y="112" width="120" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="930" y="139" font-size="15" text-anchor="middle" fill="#1F2937">LCD 显示</text>
  <text x="170" y="180" font-size="12" fill="#9CA3AF">服务只读快照 · 经统一接口访问电机 · 不得直改内部字段</text>

  <!-- ══════════ 控制逻辑层 ══════════ -->
  <text x="52" y="235" font-size="17" font-weight="bold" fill="#374151">控制逻辑层</text>
  <rect x="170" y="215" width="130" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="235" y="242" font-size="15" text-anchor="middle" fill="#1F2937">力矩</text>
  <rect x="315" y="215" width="130" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="380" y="242" font-size="15" text-anchor="middle" fill="#1F2937">速度</text>
  <rect x="460" y="215" width="130" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="525" y="242" font-size="15" text-anchor="middle" fill="#1F2937">位置</text>
  <rect x="605" y="215" width="180" height="44" rx="10" fill="#FCEBEB" stroke="#D64545" stroke-width="2"/>
  <text x="695" y="242" font-size="15" text-anchor="middle" fill="#7F1D1D">轨迹插补 / 规划器</text>
  <rect x="800" y="215" width="140" height="44" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="870" y="242" font-size="15" text-anchor="middle" fill="#1F2937">统一控制接口</text>

  <rect x="170" y="280" width="250" height="60" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="295" y="305" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">系统状态机</text>
  <text x="295" y="327" font-size="13" text-anchor="middle" fill="#6B7280">STOP · STARTING · RUN · FAULT</text>
  <rect x="435" y="280" width="250" height="60" rx="10" fill="#FDF3E3" stroke="#E8890C" stroke-width="1.5"/>
  <text x="560" y="305" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">模式表（每拍放行判定）</text>
  <text x="560" y="327" font-size="13" text-anchor="middle" fill="#6B7280">调试 6 种 · 正式 CST/CSV/CSP · 停机</text>

  <!-- 右侧高个安全保护盒 -->
  <rect x="855" y="215" width="150" height="330" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="930" y="245" font-size="15" font-weight="bold" text-anchor="middle" fill="#1F2937">系统安全保护</text>
  <text x="930" y="268" font-size="13" text-anchor="middle" fill="#6B7280">（Drive 否决权）</text>
  <text x="930" y="298" font-size="14" text-anchor="middle" fill="#374151">过流 · 过压 · 欠压</text>
  <text x="930" y="322" font-size="14" text-anchor="middle" fill="#374151">超温 · 堵转</text>
  <text x="930" y="346" font-size="14" text-anchor="middle" fill="#374151">位置反馈去抖</text>
  <text x="930" y="370" font-size="14" text-anchor="middle" fill="#374151">命令看门狗</text>
  <text x="930" y="402" font-size="13" text-anchor="middle" fill="#9CA3AF">——————</text>
  <text x="930" y="426" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7F1D1D">占空比事务</text>
  <text x="930" y="446" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7F1D1D">最终否决</text>
  <text x="930" y="470" font-size="12" text-anchor="middle" fill="#9CA3AF">常驻不可旁路</text>

  <!-- ══════════ 控制算法层 ══════════ -->
  <text x="52" y="380" font-size="17" font-weight="bold" fill="#374151">控制算法层</text>

  <rect x="170" y="360" width="380" height="70" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="360" y="380" font-size="13" text-anchor="middle" fill="#7A4FBF">速度环接口</text>
  <rect x="182" y="388" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="237" y="410" font-size="13.5" text-anchor="middle" fill="#1F2937">MIT 控制器</text>
  <rect x="302" y="388" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="357" y="410" font-size="13.5" text-anchor="middle" fill="#1F2937">PI 速度环</text>
  <rect x="422" y="388" width="115" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="479" y="410" font-size="13.5" text-anchor="middle" fill="#1F2937">轨迹调度</text>

  <rect x="580" y="360" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="710" y="380" font-size="13" text-anchor="middle" fill="#7A4FBF">电流环接口</text>
  <rect x="592" y="388" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="647" y="410" font-size="13.5" text-anchor="middle" fill="#1F2937">PI 电流环</text>
  <rect x="712" y="388" width="115" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="769" y="410" font-size="13.5" text-anchor="middle" fill="#1F2937">前馈+死区补偿</text>

  <rect x="170" y="445" width="260" height="70" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="300" y="465" font-size="13" text-anchor="middle" fill="#7A4FBF">无感观测器（规划）</text>
  <rect x="182" y="473" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="237" y="495" font-size="13.5" text-anchor="middle" fill="#1F2937">SMO 核</text>
  <rect x="302" y="473" width="115" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="359" y="495" font-size="13.5" text-anchor="middle" fill="#1F2937">FLUX 核</text>

  <rect x="460" y="445" width="380" height="70" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="650" y="465" font-size="13" text-anchor="middle" fill="#7A4FBF">波形生成接口</text>
  <rect x="472" y="473" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="527" y="495" font-size="13.5" text-anchor="middle" fill="#1F2937">SVPWM</text>
  <rect x="592" y="473" width="110" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="647" y="495" font-size="13.5" text-anchor="middle" fill="#1F2937">SPWM</text>
  <rect x="712" y="473" width="115" height="34" rx="8" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="769" y="495" font-size="13.5" text-anchor="middle" fill="#1F2937">限幅/过调制</text>

  <rect x="170" y="530" width="670" height="44" rx="10" fill="#F3EDFC" stroke="#7A4FBF" stroke-width="1.5"/>
  <text x="505" y="557" font-size="15" text-anchor="middle" fill="#1F2937">Clarke + Park 变换（纯算法核 · 主机可单测）</text>

  <!-- ══════════ 硬件适配接口层：电角度仲裁 ══════════ -->
  <rect x="170" y="590" width="670" height="60" rx="10" fill="#EAF2FC" stroke="#2F6FBF" stroke-width="1.8"/>
  <text x="505" y="615" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E3A8A">电角度仲裁器 Encoder Arbiter</text>
  <text x="505" y="638" font-size="13" text-anchor="middle" fill="#374151">MT6816 / ABZ 择一输出 · 有感与无感统一入口 · 每设备只实现一个读函数</text>

  <!-- ══════════ 硬件适配接口层：设备抽象 ══════════ -->
  <text x="52" y="700" font-size="17" font-weight="bold" fill="#374151">设备抽象与中间层</text>
  <rect x="170" y="672" width="200" height="44" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="270" y="699" font-size="14.5" text-anchor="middle" fill="#1F2937">Encoder（MT6816 / ABZ）</text>
  <rect x="385" y="672" width="170" height="44" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="470" y="699" font-size="14.5" text-anchor="middle" fill="#1F2937">CurrSense 三电阻</text>
  <rect x="570" y="672" width="150" height="44" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5"/>
  <text x="645" y="699" font-size="14.5" text-anchor="middle" fill="#1F2937">BusSense 母线</text>
  <rect x="735" y="672" width="160" height="44" rx="10" fill="#F4F5F7" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="815" y="699" font-size="14.5" text-anchor="middle" fill="#1F2937">TempSense（规划）</text>

  <rect x="170" y="732" width="340" height="44" rx="10" fill="#EAF2FC" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="340" y="759" font-size="14" text-anchor="middle" fill="#1F2937">一拍数据契约 input / duty请求·收据</text>
  <rect x="525" y="732" width="330" height="44" rx="10" fill="#EAF2FC" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="690" y="759" font-size="14" text-anchor="middle" fill="#1F2937">20kHz 固定管线 fast_loop → control_cycle</text>

  <rect x="170" y="792" width="685" height="60" rx="10" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="512" y="817" font-size="14" text-anchor="middle" fill="#7A4FBF">纯算法库（旁挂）：PID 核 · 滤波 / PLL · 观测器核 · 轨迹核 · 数学工具</text>
  <text x="512" y="840" font-size="12.5" text-anchor="middle" fill="#9CA3AF">不依赖任何上层 · 主机 gcc 可编译可单测 · 换板零改动</text>

  <text x="170" y="880" font-size="12" fill="#9CA3AF">回放缝：control_cycle_input 可来自真机 / CSV 回放 / 仿真 / HIL —— 换 MCU 只换下面一层</text>

  <!-- 分隔线 -->
  <line x1="150" y1="900" x2="1010" y2="900" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="7 5"/>

  <!-- ══════════ HAL 层（板载资源） ══════════ -->
  <rect x="150" y="918" width="860" height="260" rx="12" fill="#FFFFFF" stroke="#2E8B57" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="52" y="950" font-size="17" font-weight="bold" fill="#374151">HAL 层</text>
  <text x="52" y="970" font-size="12" fill="#9CA3AF">target</text>
  <text x="175" y="948" font-size="16" font-weight="bold" fill="#14532D">板载资源（AxDrive-L v1.3）</text>

  <rect x="170" y="966" width="235" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="287" y="986" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">PWM · TIM1 20kHz 中心对齐</text>
  <text x="287" y="1004" font-size="11.5" text-anchor="middle" fill="#6B7280">PA8/9/10 + PB13/14/15 · FD6288</text>
  <rect x="420" y="966" width="250" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="545" y="986" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">ADC 注入 · TIM1_CC4 触发</text>
  <text x="545" y="1004" font-size="11.5" text-anchor="middle" fill="#6B7280">电流 PA0/PA1/PA2 · 母线 PC5</text>
  <rect x="685" y="966" width="200" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="785" y="986" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">TIM3 编码器接口</text>
  <text x="785" y="1004" font-size="11.5" text-anchor="middle" fill="#6B7280">ABZ = PA6 / PA7 / PB0</text>
  <rect x="900" y="966" width="95" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="947" y="986" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1F2937">微秒时基</text>
  <text x="947" y="1004" font-size="11.5" text-anchor="middle" fill="#6B7280">TIM2</text>

  <rect x="170" y="1026" width="150" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="245" y="1046" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">SPI1 磁编</text>
  <text x="245" y="1064" font-size="11.5" text-anchor="middle" fill="#6B7280">MT6816 · CS=PD2</text>
  <rect x="335" y="1026" width="175" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="422" y="1046" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">SPI3 · W25Q16 / LCD</text>
  <text x="422" y="1064" font-size="11.5" text-anchor="middle" fill="#6B7280">参数片外存储 · 显示</text>
  <rect x="525" y="1026" width="170" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="610" y="1046" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">USART3 · PB10/PB11</text>
  <text x="610" y="1064" font-size="11.5" text-anchor="middle" fill="#6B7280">115200 · DMA</text>
  <rect x="710" y="1026" width="160" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="790" y="1046" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">USB CDC</text>
  <text x="790" y="1064" font-size="11.5" text-anchor="middle" fill="#6B7280">VOFA 上位机</text>
  <rect x="885" y="1026" width="110" height="44" rx="10" fill="#EAF7F0" stroke="#2E8B57" stroke-width="1.5"/>
  <text x="940" y="1046" font-size="14" font-weight="bold" text-anchor="middle" fill="#1F2937">内部 FLASH</text>
  <text x="940" y="1064" font-size="11.5" text-anchor="middle" fill="#6B7280">参数存储</text>

  <text x="175" y="1105" font-size="12.5" fill="#6B7280">换板 = 重写本层（约 7 个文件）· 按键 PC6-9 · R_EN PC13 · FDCAN PB8/PB9（预留未启用）</text>
  <text x="175" y="1128" font-size="12.5" fill="#6B7280">临界区 = PRIMASK 开关中断 · 上下文：RT(20kHz ADC中断) / MAIN(主循环) 两种</text>

  <!-- ══════════ CPU 架构 ══════════ -->
  <text x="52" y="1200" font-size="17" font-weight="bold" fill="#374151">CPU 架构</text>
  <rect x="170" y="1198" width="320" height="44" rx="10" fill="#FDF9E7" stroke="#C9A227" stroke-width="1.5"/>
  <text x="330" y="1225" font-size="15" text-anchor="middle" fill="#1F2937">STM32G474RET6 @160MHz · AxDrive-L</text>
  <rect x="505" y="1198" width="260" height="44" rx="10" fill="#FDF9E7" stroke="#C9A227" stroke-width="1.5"/>
  <text x="635" y="1225" font-size="15" text-anchor="middle" fill="#1F2937">STM32G431 · 欧拉板（移植目标）</text>
  <rect x="780" y="1198" width="230" height="44" rx="10" fill="#FDF9E7" stroke="#C9A227" stroke-width="1.5"/>
  <text x="895" y="1225" font-size="15" text-anchor="middle" fill="#1F2937">arm-gcc / Keil AC6 · CMake</text>

  <text x="170" y="1290" font-size="13" fill="#9CA3AF">依赖方向：只许向下 · 同层禁止横向 include · 板级差异只存在于 HAL 层 · 虚线框 = 规划项</text>

  <!-- 右侧栏 -->
  <line x1="1058" y1="190" x2="1058" y2="130" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1048" y="168" font-size="13" fill="#6B7280" text-anchor="end">用户交互</text>
  <line x1="1058" y1="870" x2="1058" y2="240" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1048" y="560" font-size="13" fill="#6B7280" text-anchor="end">硬件无关</text>
  <line x1="1058" y1="910" x2="1058" y2="1230" stroke="#9CA3AF" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="1048" y="1070" font-size="13" fill="#6B7280" text-anchor="end">硬件相关</text>
</svg>
